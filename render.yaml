# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: fazhi-mojing
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: STABILITY_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: FAZHI_API_URL
        fromService:
          type: web
          name: fazhi-mojing
          property: host
